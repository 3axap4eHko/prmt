name: Fuzz Testing

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-06-30
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run parser fuzzer
        run: |
          cd fuzz
          cargo fuzz run fuzz_parser -- -max_total_time=300
        continue-on-error: true

      - name: Run renderer fuzzer
        run: |
          cd fuzz
          cargo fuzz run fuzz_renderer -- -max_total_time=300
        continue-on-error: true
