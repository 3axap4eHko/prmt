name: OpenWrt
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
  workflow_run:
    workflows: [ "Release" ]
    types: [ completed ]

jobs:
  ipk:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,              target: x86_64-unknown-linux-musl,      asset_os: ubuntu-24.04, sdk: ghcr.io/openwrt/sdk@sha256:857329c75dcba07d05842eb8a0921d03514d5655c75f7514014f1d64cd8b00f8 }
          - { arch: aarch64_cortex-a53,  target: aarch64-unknown-linux-musl,     asset_os: ubuntu-24.04, sdk: ghcr.io/openwrt/sdk@sha256:cb68f1a921301060ec9cc23adce8cc49131c9564464b66c837d06737d80b0084 }
          - { arch: arm_cortex-a7,       target: armv7-unknown-linux-musleabihf, asset_os: ubuntu-24.04, sdk: ghcr.io/openwrt/sdk@sha256:9c67abc1154f0be7559c759c20fa55daa01477ad2fce0b05e557745de56b71ec }
    container:
      image: ${{ matrix.sdk }}
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve release metadata
        id: meta
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          git fetch --force --tags
          tag="${MANUAL_TAG:-$RUN_HEAD_BRANCH}"
          if [ -z "$tag" ]; then
            tag="$(git tag --points-at "$RUN_HEAD_SHA" | head -n1)"
          fi
          if [ -z "$tag" ]; then
            echo "Unable to determine tag for ${RUN_HEAD_SHA}" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download and verify release archive
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p /work && cd /work
          file="prmt-${{ matrix.target }}-${{ matrix.asset_os }}.tar.gz"
          curl -sSfL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o "$file" \
            "https://github.com/${REPO}/releases/download/${TAG}/$file"
          curl -sSfL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o "${file}.sha256" \
            "https://github.com/${REPO}/releases/download/${TAG}/${file}.sha256"
          sha256sum -c "${file}.sha256"
          tar -xzf "$file" -C /work

      - name: Build .ipk
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eux
          cd /work
          d=$(find . -maxdepth 1 -type d -name 'prmt-*' | head -n1)
          test -n "$d"
          install -Dm755 "$d/prmt" ./pkg/usr/bin/prmt
          install -Dm644 "$d/LICENSE" ./pkg/usr/share/licenses/prmt/LICENSE

          mkdir -p ./pkg/CONTROL
          {
            printf 'Package: prmt\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Architecture: %s\n' "$ARCH"
            printf 'Section: utils\n'
            printf 'Priority: optional\n'
            printf 'Depends:\n'
            printf 'Source: https://github.com/%s\n' "$REPO"
            printf 'Description: Ultra-fast customizable shell prompt (static Rust binary)\n'
          } > ./pkg/CONTROL/control

          ipkg-build -o root -g root ./pkg
          mkdir -p /out
          mv *.ipk /out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-${{ matrix.arch }}
          path: |
            /out/*.ipk
